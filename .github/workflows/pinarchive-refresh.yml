name: PinArchive Refresh

on:
  schedule:
    - cron: '0 3 */2 * *'
  workflow_dispatch:
    inputs:
      workspace_id:
        description: 'Workspace UUID (empty = all workspaces)'
        required: false
        type: string
      username:
        description: 'Single account username (empty = all in workspace)'
        required: false
        type: string

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Probe single pin fetch
        continue-on-error: true
        run: node scripts/test-pin-fetch.mjs 1079245498222414527

      - name: Run PinArchive Refresh
        env:
          PINARCHIVE_SUPABASE_URL: ${{ secrets.PINARCHIVE_SUPABASE_URL }}
          PINARCHIVE_SUPABASE_KEY: ${{ secrets.PINARCHIVE_SUPABASE_KEY }}
          PINORBIT_WORKER_URL: ${{ secrets.PINORBIT_WORKER_URL }}
          PINARCHIVE_INGEST_SECRET: ${{ secrets.PINARCHIVE_INGEST_SECRET }}
          REFRESH_WORKSPACE_ID: ${{ github.event.inputs.workspace_id || '' }}
          REFRESH_USERNAME: ${{ github.event.inputs.username || '' }}
        run: node scripts/pinarchive-refresh.mjs
