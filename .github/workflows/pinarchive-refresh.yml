name: PinArchive Refresh

on:
  workflow_dispatch:
    inputs:
      workspace_id:
        description: 'Workspace UUID (empty = all workspaces)'
        required: false
        type: string
      username:
        description: 'Single account username (empty = all in workspace)'
        required: false
        type: string
      usernames:
        description: 'Comma-separated usernames (optional)'
        required: false
        type: string
      force:
        description: 'Force refresh ignoring interval eligibility (true/empty)'
        required: false
        type: string
        default: ''

concurrency:
  group: pinarchive-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Probe single pin fetch
        continue-on-error: true
        run: node scripts/test-pin-fetch.mjs 1079245498222414527

      - name: Run PinArchive Refresh (Shard ${{ matrix.shard }}/4)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PINARCHIVE_SUPABASE_URL: ${{ secrets.PINARCHIVE_SUPABASE_URL }}
          PINARCHIVE_SUPABASE_KEY: ${{ secrets.PINARCHIVE_SUPABASE_KEY }}
          PINORBIT_WORKER_URL: ${{ secrets.PINORBIT_WORKER_URL }}
          PINARCHIVE_INGEST_SECRET: ${{ secrets.PINARCHIVE_INGEST_SECRET }}
          REFRESH_WORKSPACE_ID: ${{ github.event.inputs.workspace_id || '' }}
          REFRESH_USERNAME: ${{ github.event.inputs.username || '' }}
          REFRESH_USERNAMES: ${{ github.event.inputs.usernames || '' }}
          REFRESH_FORCE: ${{ github.event.inputs.force || '' }}
          REFRESH_SHARD: ${{ matrix.shard }}
          SHARD_COUNT: 4
          REFRESH_MAX_PINS: '0'
        run: node scripts/pinarchive-refresh.mjs
